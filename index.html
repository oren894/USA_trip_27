<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trip to the United States</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly travel app, calm and readable for a parent on a phone
   IDEA: the trip planner itself, a printed road-trip itinerary card by card
   PICTURE: the itinerary list, with a route ribbon from Pittsburgh to LA in the header
   COLOUR and TYPE: white cards, coral accent, a distinct colour per day; Source Sans 3
   LAYOUT: one column, 720px max, sticky tabs and day chips, bottom sheet for navigation */
:root{color-scheme:light dark;--bg:light-dark(#f3f4f6,#0f1115);--card:light-dark(#fff,#1a1d24);--ink:light-dark(#1f2328,#eef0f3);--mut:light-dark(#6b7280,#9aa1ad);--line:light-dark(#e5e7eb,#2a2f38);--chip:light-dark(#eceef1,#262a33);--acc:#f4573b;--link:light-dark(#3b4fe0,#8ea0ff);--warn:light-dark(#f6cf9e,#5a3d1c);--warnink:light-dark(#9a4a12,#f7c48c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
a{color:var(--link);text-decoration:none}
.wrap{max-width:720px;margin:0 auto}
header.hero{position:relative;height:200px;background:linear-gradient(160deg,#16324f,#24527a 55%,#e9845f);overflow:hidden}
header.hero svg{position:absolute;inset:0;width:100%;height:100%}
.title{position:relative;margin:-70px 16px 0;background:var(--card);border-radius:20px;padding:22px 22px 18px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.title h1{margin:0;font-size:clamp(28px,7vw,38px);line-height:1.05;font-weight:800;text-wrap:balance}
.title p{margin:10px 0 0;color:var(--mut);font-weight:600}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line);margin-top:14px}
nav.tabs button{flex:1;font:700 17px "Source Sans 3",sans-serif;color:var(--mut);background:none;border:0;padding:12px 6px;min-height:44px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected=true]{color:var(--acc);border-color:var(--acc)}
.days{position:sticky;top:58px;z-index:4;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days a{flex:none;background:var(--chip);color:var(--ink);font-weight:700;padding:9px 16px;border-radius:99px;font-size:15px;white-space:nowrap}
.days a.on{background:var(--ink);color:var(--bg)}
section.view{display:none;padding:4px 12px 90px}section.view.on{display:block}
.day{background:var(--card);border-radius:20px;padding:18px 16px;margin:14px 0;scroll-margin-top:120px}
.dh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.dh h2{margin:0;font-size:36px;line-height:1.05;font-weight:800}
.dh span{color:var(--mut);font-weight:700}
.tot{color:var(--mut);font-size:15px;margin:6px 0 4px}
.route{display:inline-flex;align-items:center;gap:6px;font-weight:700;margin:6px 0 2px;min-height:40px}
.lodge{display:flex;align-items:center;gap:12px;background:var(--chip);border-radius:99px;padding:8px 14px 8px 8px;margin:10px 0}
.lodge b{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bed{width:36px;height:36px;border-radius:50%;background:#e6dcf3;display:grid;place-items:center;flex:none}
.nolodge{font-size:14px;color:#7b4bb7;background:light-dark(#efe7f8,#2b2238);border-radius:12px;padding:8px 12px;margin:10px 0}
.empty{color:var(--mut);font-size:15px;margin:8px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.top{display:flex;gap:12px}
.top .txt{flex:1}
.nm{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;box-shadow:0 0 0 3px light-dark(#fff,#1a1d24),0 0 0 4px currentColor}
.nm h3{margin:0;font-size:20px;line-height:1.2;font-weight:700;padding-top:2px}
.hrs{color:var(--mut);font-size:15px;margin:6px 0 0}
.tag{display:inline-block;background:var(--chip);color:var(--mut);font-weight:700;font-size:14px;border-radius:10px;padding:3px 10px;margin-top:8px}
.tile{flex:none;width:88px;height:88px;border-radius:16px;display:grid;place-items:center}
.tile svg{width:44px;height:44px}
.note{margin:12px 0 0}
.eat{display:inline-block;font-size:13px;font-weight:700;color:#0b7a4b;background:light-dark(#dff5ea,#123a29);border-radius:8px;padding:1px 8px;margin-inline-start:4px}
.go{display:flex;gap:8px;margin-top:14px}
.go button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:14px;border:0;background:var(--acc);color:#fff;font:700 16px "Source Sans 3",sans-serif;cursor:pointer}
.go button:focus-visible,nav.tabs button:focus-visible,.sheet a:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.book{display:inline-flex;gap:6px;align-items:center;background:var(--warn);color:var(--warnink);font-weight:700;font-size:14px;border-radius:10px;padding:4px 12px;margin:8px 0 0}
.leg{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14px;padding:10px 6px}
.leg::after{content:"";flex:1;border-top:2px dashed var(--line)}
.leg a{font-weight:600}
.stack>*+*{margin-top:0}
.box{background:var(--card);border-radius:20px;padding:18px;margin:14px 0}
.box h2{margin:0 0 10px;font-size:26px;font-weight:800}
.plan{list-style:none;padding:0;margin:0}
.plan li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.plan li:first-child{border:0}
.plan a{color:var(--ink);display:flex;gap:10px;width:100%}
.plan .d{flex:none;width:64px;font-weight:800;white-space:nowrap}
.fine{color:var(--mut);font-size:15px}
.opts .card{margin:12px 0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:13}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:14;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-width:720px;margin:0 auto}
.open .scrim{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h4{margin:0;font-size:20px}.sheet p{margin:2px 0 14px;color:var(--mut);font-size:15px}
.sheet a.app{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--chip);color:var(--ink);font-weight:700;font-size:18px;margin-bottom:10px;min-height:60px}
.sheet a.app i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-style:normal}
.sheet label{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--mut);padding:6px 2px;min-height:44px}
.sheet input{width:20px;height:20px}
.sheet .x{width:100%;min-height:48px;border:0;border-radius:14px;background:none;color:var(--mut);font:700 16px "Source Sans 3",sans-serif;cursor:pointer}
.mapbox{position:relative;height:max(400px,calc(100vh - 140px));border-radius:20px;overflow:hidden;background:#dfe9ee;isolation:isolate;z-index:0}
#map{position:absolute;inset:0}.leaflet-container{font-family:"Source Sans 3",sans-serif}
.pin{width:32px;height:32px;border-radius:50%;color:#fff;font:800 15px/28px "Source Sans 3",sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin.sel{transform:scale(1.25)}
.leaflet-tooltip.lbl{background:#fff;border:0;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.25);font:700 13px "Source Sans 3",sans-serif;color:#1f2328;padding:2px 8px}
.leaflet-tooltip.lbl::before{display:none}
.pcard{position:fixed;left:0;right:0;bottom:0;z-index:12;max-width:720px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.25);padding:14px 14px calc(16px + env(safe-area-inset-bottom));max-height:70vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s}
.pcard.on{transform:none}
.pcard .card{border:0;box-shadow:none;padding:6px 4px 0}
.pcard .xx{float:right;width:44px;height:44px;border:0;border-radius:50%;background:var(--chip);color:var(--ink);font-size:24px;cursor:pointer}
.pcard .mday{margin:10px 0 0 4px;font-size:15px}
@media(prefers-reduced-motion:reduce){.pcard{transition:none}}
.land{fill:light-dark(#f5f2ea,#232a33);stroke:light-dark(#c9c2b2,#3a4350);stroke-width:1;vector-effect:non-scaling-stroke}
.rline{fill:none;stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round;opacity:.85}
.mk{cursor:pointer}.mk circle{stroke:#fff;stroke-width:2.5}.mk text{fill:#fff;font:800 12px "Source Sans 3",sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk .lb{fill:var(--ink);font:700 13px "Source Sans 3",sans-serif;text-anchor:start;paint-order:stroke;stroke:light-dark(#fff,#111);stroke-width:4px;stroke-linejoin:round}
.mtools{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:8px}
.mtools button{width:44px;height:44px;border-radius:12px;border:0;background:var(--card);color:var(--ink);font:700 22px "Source Sans 3",sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer}
.mcard{position:absolute;left:10px;right:10px;bottom:10px;display:none}.mcard.on{display:block}
.mcard .card{box-shadow:0 8px 24px rgba(0,0,0,.2)}
.mcard .xx{position:absolute;top:8px;right:8px;width:40px;height:40px;border:0;border-radius:50%;background:var(--chip);color:var(--ink);font-size:20px;cursor:pointer;z-index:1}
.mday{color:var(--mut);font-weight:700;font-size:14px;margin:0 0 4px 40px}
@media(prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
@media(max-width:420px){.tile{width:64px;height:64px;border-radius:12px}.tile svg{width:34px;height:34px}.dh h2{font-size:30px}}
</style>
<style>
.edit{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;border:0;border-radius:12px;background:var(--chip);color:var(--ink);font:700 15px "Source Sans 3",sans-serif;padding:0 12px;cursor:pointer}
.go .edit{flex:none;min-height:46px;border-radius:14px}
.mapbox{scroll-margin-top:124px}.go button.edit{background:var(--chip);color:var(--ink)}
.ro .edit:not(.lnav),.ro .addp{display:none}
.addp{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin:12px 0 0;border:2px dashed var(--line);border-radius:16px;background:none;color:var(--mut);font:700 16px "Source Sans 3",sans-serif;cursor:pointer}
.dh .edit{margin-inline-start:auto}
.boxh{display:flex;align-items:center;gap:10px}.boxh h2{flex:1}
.notes{white-space:pre-line;margin:0}
.form{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.45);overflow-y:auto}
.form.on{display:block}
.form form{background:var(--card);max-width:560px;margin:24px auto;border-radius:22px;padding:20px 18px}
.form h4{margin:0 0 12px;font-size:22px}
.form label{display:block;font-weight:700;font-size:15px;margin:12px 0 4px}
.form input[type=text],.form textarea,.form select{width:100%;font:16px "Source Sans 3",sans-serif;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.form textarea{min-height:90px;resize:vertical}
.form .hint{color:var(--mut);font-size:14px;margin:4px 0 0}
.form .chk{display:flex;gap:10px;align-items:center;font-weight:600;min-height:44px;margin:4px 0}
.form .chk input{width:22px;height:22px}
.form .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.form .row button{flex:1;min-height:48px;border-radius:14px;border:0;font:700 16px "Source Sans 3",sans-serif;cursor:pointer;background:var(--chip);color:var(--ink)}
.form .row .pri{background:var(--acc);color:#fff}
.form .row .del{background:light-dark(#fde2e2,#4a1d1d);color:light-dark(#b42318,#ffb4ab)}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;background:#1f2328;color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:none;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 24px)}
.toast.on{display:flex}.toast button{min-height:40px;border:0;border-radius:10px;background:#3a3f47;color:#fff;font:700 15px "Source Sans 3",sans-serif;padding:0 14px;cursor:pointer}
.status{color:var(--mut);font-size:14px;margin:8px 0 0}
</style>
</head>

 const nv=e.target.closest('button[data-i]');
 if(nv){const p=reg[+nv.dataset.i];$('#shT').textContent=p.name;aW.href=wLink(p);aG.href=gLink(p);sh.classList.add('open');aW.focus();return}
 const j=e.target.closest('[data-jump],#chips a');
 if(j){e.preventDefault();show('itinerary');const t=document.getElementById(j.dataset.jump||j.dataset.d);t&&t.scrollIntoView({behavior:'smooth'});return}
 const ed=e.target.closest('[data-ed]');if(ed){closeCard();placeForm(ed.dataset.ed);return}
 const ad=e.target.closest('[data-add]');if(ad){placeForm(null,ad.dataset.add);return}
 const dy=e.target.closest('[data-day]');if(dy){dayForm(+dy.dataset.day);return}
 if(e.target.closest('[data-notes]'))notesForm();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeForm()}});
// forms
const F=$('#f'),FW=$('#form');
const closeForm=()=>FW.classList.remove('on');
FW.addEventListener('click',e=>{if(e.target===FW)closeForm()});
const openForm=(html,onSave,extra)=>{F.innerHTML=html;FW.classList.add('on');FW.scrollTop=0;F.onsubmit=ev=>{ev.preventDefault();onSave(new FormData(F))};F.querySelector('[data-cancel]').onclick=closeForm;extra&&extra();setTimeout(()=>{const i=F.querySelector('input,textarea');i&&i.focus()},50)};
const parseLL=v=>{v=String(v||'');let m=v.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||v.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||v.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);return m?[+m[1],+m[2]]:null};
const get=w=>{if(!w)return null;const[a,b]=w.split(':');return a==='o'?{list:S.opts,k:+b,day:'o'}:{list:S.days[+a].stops,k:+b,day:a}};
const listOf=d=>d==='o'?S.opts:S.days[+d].stops;
const fld=(n,l,v,h='')=>`<label for="f-${n}">${l}</label><input type="text" id="f-${n}" name="${n}" value="${esc(v)}">${h?`<p class="hint">${h}</p>`:''}`;
const placeForm=(where,addTo)=>{
 const g=get(where),p=g?g.list[g.k]:{t:'star'},cur=g?g.day:addTo;
 const dayOpts=S.days.map((x,i)=>`<option value="${i}"${String(i)===String(cur)?' selected':''}>${esc(x.d)} · ${esc(x.sub.replace(/^\w+ • /,'')).slice(0,40)}</option>`).join('')+`<option value="o"${cur==='o'?' selected':''}>Optional list</option>`;
 const n=g?g.list.length:0;
 openForm(`<h4>${g?'Edit place':'Add a place'}</h4>
 ${fld('name','Name *',p.name)}
 <label for="f-day">Day</label><select id="f-day" name="day">${dayOpts}</select>
 ${g?`<label for="f-pos">Position in the day</label><select id="f-pos" name="pos">${Array.from({length:n},(_,i)=>`<option value="${i}"${i===g.k?' selected':''}>${i+1}</option>`).join('')}</select><p class="hint">Only applies when the day stays the same.</p>`:''}
 <label for="f-t">Type (icon)</label><select id="f-t" name="t">${Object.keys(NAMES).map(k=>`<option value="${k}"${k===p.t?' selected':''}>${NAMES[k]}</option>`).join('')}</select>
 ${fld('tag','Label',p.tag,'For example Beach, Park, Restaurant')}
 ${fld('hrs','Opening hours',p.hrs)}
 <label for="f-note">Note</label><textarea id="f-note" name="note">${esc(p.note)}</textarea>
 <label class="chk"><input type="checkbox" name="eat"${p.eat?' checked':''}> Eat here</label>
 <label class="chk"><input type="checkbox" name="book"${p.book?' checked':''}> Consider booking ahead</label>
 ${fld('addr','Address or search text for navigation',p.addr||p.q||'','Leave empty to search by the name')}
 ${fld('ll','Coordinates or Google Maps link',has(p)?p.lat+', '+p.lng:'','Paste a Google Maps link or "lat, lng" to put it on the map')}
 <div class="row"><button type="submit" class="pri">Save</button><button type="button" data-cancel>Cancel</button>${g?'<button type="button" class="del" id="fdel">Delete</button>':''}</div>`,
 fd=>{const name=(fd.get('name')||'').trim();if(!name){F.querySelector('#f-name').focus();return}
  const q={...(g?p:{}),name,t:fd.get('t'),tag:fd.get('tag').trim(),hrs:fd.get('hrs').trim(),note:fd.get('note').trim(),eat:!!fd.get('eat'),book:!!fd.get('book')};
  const ad=fd.get('addr').trim();delete q.addr;delete q.q;if(ad){if(p.addr||!g)q.addr=ad;else q.q=ad}
  const ll=parseLL(fd.get('ll'));if(ll){q.lat=ll[0];q.lng=ll[1]}else{delete q.lat;delete q.lng}
  if(g&&ll&&has(p)&&(ll[0]!==p.lat||ll[1]!==p.lng)){delete q.leg}
  Object.keys(q).forEach(k=>{if(q[k]===''||q[k]===false)delete q[k]});
  change(g?'Place updated':'Place added',()=>{const to=fd.get('day');
   if(g){g.list.splice(g.k,1);if(g.list[g.k])delete g.list[g.k].leg;
    const dest=listOf(to);let pos=to===g.day?+fd.get('pos'):dest.length;delete q.leg;if(to===g.day&&pos===g.k&&p.leg)q.leg=p.leg;
    dest.splice(pos,0,q);if(dest[pos+1]&&!(to===g.day&&pos===g.k))delete dest[pos+1].leg;
    if(to!==g.day||pos!==g.k){clearTot(g.day);clearTot(to)}}
   else{listOf(to).push(q);clearTot(to)}});
  closeForm()},
 ()=>{const d=F.querySelector('#fdel');if(d)d.onclick=()=>{if(d.dataset.sure){change('Place deleted',()=>{g.list.splice(g.k,1);if(g.list[g.k])delete g.list[g.k].leg;clearTot(g.day)});closeForm()}else{d.dataset.sure=1;d.textContent='Tap again to delete'}}});
};
const clearTot=d=>{if(d!=='o'&&S.days[+d])S.days[+d].tot=''};
const dayForm=i=>{const x=S.days[i],l=x.lodge||{};
 openForm(`<h4>Edit ${esc(x.d)}</h4>${fld('sub','Day title',x.sub)}${fld('tot','Total driving (optional)',x.tot)}
 <label class="chk"><input type="checkbox" name="hasl"${x.lodge?' checked':''}> Sleeping at a hotel this night</label>
 ${fld('ln','Hotel name',l.name)}${fld('la','Hotel address',l.addr)}
 <div class="row"><button type="submit" class="pri">Save</button><button type="button" data-cancel>Cancel</button></div>`,
 fd=>{change('Day updated',()=>{x.sub=fd.get('sub').trim()||x.sub;x.tot=fd.get('tot').trim();const n=fd.get('ln').trim();
  if(fd.get('hasl')&&n){const same=x.lodge&&x.lodge.name===n;x.lodge={name:n,addr:fd.get('la').trim()};if(same&&has(l)){x.lodge.lat=l.lat;x.lodge.lng=l.lng}}else x.lodge=null});closeForm()})};
const notesForm=()=>openForm(`<h4>Edit notes</h4><label for="f-notes">Notes</label><textarea id="f-notes" name="notes" style="min-height:320px">${esc(S.notes)}</textarea><div class="row"><button type="submit" class="pri">Save</button><button type="button" data-cancel>Cancel</button></div>`,fd=>{change('Notes updated',()=>{S.notes=fd.get('notes')});closeForm()});
// change + undo + toast
let tt=null;
const toast=(m,undo)=>{$('#tmsg').textContent=m;$('#undo').style.display=undo?'':'none';$('#toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('on'),6000)};
const change=(msg,fn)=>{hist.push(clone(S));if(hist.length>30)hist.shift();fn();render();persist();toast(msg,true)};
$('#undo').onclick=()=>{if(!hist.length)return;S=hist.pop();render();persist();toast('Change undone',hist.length>0)};
// storage
let ref=null,saving=false,again=false;
const status=m=>{$('#status').textContent=m};
const persist=async()=>{
 if(!ref){try{localStorage.setItem('trip-plan',JSON.stringify(S));status('Changes are saved on this device only.')}catch(e){status('Changes will be lost when you close this page.')}return}
 if(saving){again=true;return}saving=true;status('Saving…');
 try{await ref.set({plan:clone(S),at:Date.now()});status('All changes saved.')}
 catch(e){if(e&&e.code==='invalid_argument'){canWrite=false;render();status("You can view this trip but not save changes.")}else if(e&&e.code==='unavailable'){again=true;status('Retrying…')}else status('Not saved. Check your connection and try again.')}
 saving=false;if(again){again=false;setTimeout(persist,800)}};
(async()=>{
 const C=typeof claude!=='undefined'&&claude&&claude.use?claude:null;
 let db=null;try{db=C?await C.use('db'):null}catch(e){}
 if(!db){try{const l=localStorage.getItem('trip-plan');if(l){S=JSON.parse(l);render()}}catch(e){}return}
 try{const u=await C.use('user');if(u){const w=await u.can('data.write');if(w===false){canWrite=false;render()}}}catch(e){}
 ref=db.doc('trip/plan');
 const tm=setTimeout(()=>status('Showing the saved plan; latest changes could not be loaded yet.'),10000);
 ref.onSnapshot(snap=>{if(!snap.metadata.fromCache)clearTimeout(tm);if(snap.exists&&!saving){const d=snap.data();if(d&&d.plan&&Array.isArray(d.plan.days)){S=clone(d.plan);render();if(!snap.metadata.fromCache&&$('#status').textContent.startsWith('Showing'))status('')}}},()=>clearTimeout(tm));
})();
// map
let M=null,sel='all';
const mch=$('#mchips');
const mpts=()=>{const a=[];S.days.forEach(x=>x.stops.forEach((p,k)=>has(p)&&a.push({p,n:k+1,c:x.c,g:x.id,day:x.d+' · '+x.sub.replace(/^\w+ • /,''),w:S.days.indexOf(x)+':'+k})));S.opts.forEach((p,k)=>has(p)&&a.push({p,n:k+1,c:'#d93a4a',g:'opt',day:'Optional stop',w:'o:'+k}));return a};
const chipsMap=()=>{const gs=[['all','All'],...S.days.filter(x=>x.stops.some(has)).map(x=>[x.id,x.d]),['opt','Optional']];mch.innerHTML=gs.map(g=>`<a href="#" data-g="${g[0]}" class="${g[0]===sel?'on':''}">${esc(g[1])}</a>`).join('')};
const initMap=()=>{
 if(typeof L==='undefined'){$('.mapbox').innerHTML='<p class="empty" style="padding:20px">The map could not load. Check your internet connection and open this tab again.</p>';return}
 if(M){M.map.invalidateSize();M.fit(sel);return}
 const map=L.map('map',{zoomControl:true,zoomSnap:.25}).setView([37,-100],4);
 L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(map);
 const layer=L.layerGroup().addTo(map);let mk=[];
 const draw=()=>{layer.clearLayers();mk=[];
  const vis=mpts().filter(d=>sel==='all'?d.g!=='opt':d.g===sel);
  const ids=[...new Set(vis.map(d=>d.g))].filter(g=>g!=='opt');
  ids.forEach(g=>{const a=vis.filter(d=>d.g===g);if(a.length>1)L.polyline(a.map(d=>[d.p.lat,d.p.lng]),{color:a[0].c,weight:3,dashArray:'4 8',opacity:.8}).addTo(layer)});
  vis.forEach(d=>{const m=L.marker([d.p.lat,d.p.lng],{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${d.c}">${d.n}</div>`,iconSize:[32,32],iconAnchor:[16,16]}),title:d.p.name,keyboard:true}).addTo(layer);
   if(sel!=='all')m.bindTooltip(esc(d.p.name),{permanent:true,direction:'right',offset:[16,0],className:'lbl'});
   m.on('click',()=>openCard(d));mk.push(m)});
  return vis};
 const fit=(g)=>{sel=g;chipsMap();closeCard();const vis=draw();if(!vis.length)return;
  if(vis.length===1)map.setView([vis[0].p.lat,vis[0].p.lng],14);
  else map.fitBounds(L.latLngBounds(vis.map(d=>[d.p.lat,d.p.lng])),{paddingTopLeft:[30,40],paddingBottomRight:[110,40],maxZoom:15})};
 M={map,fit,update:()=>{chipsMap();draw()}};
 setTimeout(()=>{map.invalidateSize();fit(sel)},50);
};
const mc=$('#mcard');
const openCard=d=>{mc.innerHTML=`<button class="xx" aria-label="Close">×</button><p class="mday">${esc(d.day)}</p>`+card(d.p,d.n,d.c,d.w);mc.classList.add('on');mc.scrollTop=0;mc.querySelector('.xx').onclick=closeCard;if(M)M.map.panTo([d.p.lat,d.p.lng])};
const closeCard=()=>mc.classList.remove('on');
mch.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();sel=a.dataset.g;M?M.fit(sel):initMap()});
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.v!=='map')closeCard()}));
render();
}
</script>
</body>
